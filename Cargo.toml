[package]
name = "zero-hermes"
version = "0.1.0"
edition = "2021"
description = "Minimal Rust reimplementation of the Hermes Agent core (agent loop, telegram gateway, cron, skills, sqlite memory)"
license = "MIT"

[lib]
name = "zero_hermes"
path = "src/lib.rs"

[[bin]]
name = "zero-hermes"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-std", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
cron = "0.12"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
async-trait = "0.1"
futures = "0.3"
toml = "0.8"
libc = "0.2"
# CSRF token entropy for the web UI. Already in the tree via rustls; direct
# dep costs nothing in binary size.
getrandom = "0.2"
bytes = "1"
# Web UI: axum for the HTTP server + SSE; tokio-stream for Stream bodies.
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query", "form"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
